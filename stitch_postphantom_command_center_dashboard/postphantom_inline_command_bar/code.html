<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PostPhantom Inline Command Bar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4848e5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111121",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-6 overflow-hidden">
<!-- Mock Background representing LinkedIn Feed -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none p-10 flex flex-col gap-8 max-w-4xl mx-auto">
<div class="h-32 w-full bg-white dark:bg-slate-800 rounded-lg shadow-sm"></div>
<div class="h-64 w-full bg-white dark:bg-slate-800 rounded-lg shadow-sm"></div>
<div class="h-64 w-full bg-white dark:bg-slate-800 rounded-lg shadow-sm"></div>
</div>
<!-- EXT-04 Command Bar (Floating Pill) -->
<div class="relative z-[9999] w-full max-w-[840px]">
<!-- Section Label (Floating above) -->
<div class="flex justify-center mb-4">
<span class="bg-primary/10 text-primary dark:bg-primary/20 dark:text-primary px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase">
                PostPhantom Active
            </span>
</div>
<!-- The Main Command Bar Container -->
<div class="flex items-center gap-2 p-2 bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-700 rounded-full shadow-2xl glass-effect">
<!-- Left Side: Brand Icon & Input -->
<div class="flex items-center flex-1 min-w-0 pl-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[24px]">mist</span>
</div>
<div class="flex-1 px-3">
<input class="w-full bg-transparent border-none focus:ring-0 text-slate-800 dark:text-slate-100 placeholder:text-slate-400 text-base font-normal py-2" placeholder="Ask PostPhantom to draft or refine..." type="text"/>
</div>
</div>
<!-- Middle Section: Mode Chips -->
<div class="hidden md:flex items-center gap-1.5 px-2 border-l border-slate-200 dark:border-slate-700">
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-primary/10 hover:text-primary transition-colors px-4 border border-transparent hover:border-primary/30">
<span class="text-slate-700 dark:text-slate-200 text-xs font-semibold">Debate</span>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-primary/10 hover:text-primary transition-colors px-4 border border-transparent hover:border-primary/30">
<span class="text-slate-700 dark:text-slate-200 text-xs font-semibold">Question</span>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-primary/10 hover:text-primary transition-colors px-4 border border-transparent hover:border-primary/30">
<span class="text-slate-700 dark:text-slate-200 text-xs font-semibold">Agree</span>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary text-white shadow-lg shadow-primary/25 px-4">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
<span class="text-xs font-semibold">Voice Match</span>
</button>
</div>
<!-- Right Side: Action Icons -->
<div class="flex items-center gap-1 pr-2 pl-2 border-l border-slate-200 dark:border-slate-700">
<!-- Expand to Editor -->
<button class="p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors flex items-center justify-center" title="Expand to Editor">
<span class="material-symbols-outlined text-[20px]">open_in_full</span>
</button>
<!-- Copilot Sidebar -->
<button class="p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors flex items-center justify-center" title="Copilot Sidebar">
<span class="material-symbols-outlined text-[20px]">side_navigation</span>
</button>
</div>
</div>
<!-- Contextual Tooltip (Optional visual flair) -->
<div class="flex justify-start px-8 mt-3">
<div class="flex items-center gap-2 text-[11px] text-slate-400 dark:text-slate-500 font-medium">
<span class="flex h-2 w-2 rounded-full bg-green-500"></span>
<span>AI ready to rewrite your draft</span>
<span class="mx-1">•</span>
<button class="hover:text-primary transition-colors uppercase tracking-tighter">View Shortcuts (⌘ + K)</button>
</div>
</div>
</div>
<!-- UI Elements in the background to show depth -->
<div class="absolute bottom-10 right-10 flex flex-col gap-4 max-w-[200px] z-10 pointer-events-none opacity-50">
<div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700">
<div class="w-12 h-2 bg-slate-200 dark:bg-slate-700 rounded-full mb-3"></div>
<div class="w-full h-2 bg-slate-100 dark:bg-slate-700/50 rounded-full mb-2"></div>
<div class="w-full h-2 bg-slate-100 dark:bg-slate-700/50 rounded-full"></div>
</div>
</div>
</body></html>
