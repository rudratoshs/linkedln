<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .logo {
      font-size: 24px;
      margin-right: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #0a66c2;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .status.active {
      background: #e8f5e8;
      color: #2d5a2d;
      border: 1px solid #c3e6c3;
    }
    .status.inactive {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    .instructions {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    .button {
      background: #0a66c2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      margin-bottom: 8px;
    }
    .button:hover {
      background: #004182;
    }
    .button.secondary {
      background: #666;
    }
    .button.secondary:hover {
      background: #555;
    }
    .footer {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🚀</div>
    <div class="title">PostPhantom</div>
  </div>
  
  <div id="status" class="status inactive">
    <strong>Status:</strong> Checking LinkedIn...
  </div>
  
  <div class="instructions">
    PostPhantom works automatically when you're composing a LinkedIn post. Look for the AI assistant near the text editor.
  </div>
  
  <button id="openLinkedIn" class="button">
    Open LinkedIn
  </button>
  
  <button id="refreshStatus" class="button secondary">
    Refresh Status
  </button>
  
  <div class="footer">
    v1.0.0 • AI-powered LinkedIn assistant
  </div>

  <script src="popup.js"></script>
</body>
</html>
