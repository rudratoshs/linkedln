<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Mock - PostPhantom Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background: #f3f2ef;
        }
        .linkedin-composer {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-width: 600px;
        }
        .ql-editor {
            min-height: 100px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            outline: none;
        }
        .ql-editor[contenteditable="true"]:empty:before {
            content: attr(data-placeholder);
            color: #999;
        }
    </style>
</head>
<body>
    <h1>LinkedIn Mock Page for PostPhantom Testing</h1>
    <p>This page simulates LinkedIn's post composer to test PostPhantom extension.</p>
    
    <div class="linkedin-composer">
        <h3>Start a post</h3>
        <div 
            class="ql-editor" 
            contenteditable="true" 
            data-placeholder="What do you want to talk about?"
            role="textbox"
            aria-label="Text editor for creating content"
        ></div>
        <button style="margin-top: 10px; padding: 8px 16px; background: #0a66c2; color: white; border: none; border-radius: 4px;">Post</button>
    </div>

    <div class="linkedin-composer">
        <h3>Alternative composer (different selector)</h3>
        <textarea 
            placeholder="What do you want to talk about?"
            style="width: 100%; height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 4px;"
        ></textarea>
        <button style="margin-top: 10px; padding: 8px 16px; background: #0a66c2; color: white; border: none; border-radius: 4px;">Post</button>
    </div>

    <script>
        // Simulate LinkedIn's hostname for testing
        console.log('Mock LinkedIn page loaded');
        console.log('Current hostname:', window.location.hostname);
        
        // Add some LinkedIn-like behavior
        document.querySelector('.ql-editor').addEventListener('focus', function() {
            console.log('LinkedIn composer focused');
        });
    </script>
</body>
</html>
